name: M1 reviewed tree validation
on:
  push:
    branches: [feat/yoke-2-control-plane-foundation]
    paths: [.github/workflows/dev-validation-bundle.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Materialize the checksum-pinned reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(process.env.GITHUB_REPOSITORY, 'HECer/yoke');
          assert.equal(git('rev-parse', 'HEAD^'), '330b84b83d1b3a7c7f4601c71b42973b4c62f4f9');
          assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
          const chunks = ['f685118d67126eb31ce3cae7dff4c6d802bb796c', 'c3092dca1e14cd5e1fa6ce2a2b38c99b7abb8fed', 'c60bddf9adb7a2c37c8a59034aed252ed93be47d'];
          let encoded = '';
          for (const sha of chunks) {
            const response = await fetch(`https://api.github.com/repos/HECer/yoke/git/blobs/${sha}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(30000) });
            assert.ok(response.ok, `Cannot retrieve reviewed patch object: HTTP ${response.status}`);
            const blob = await response.json();
            assert.equal(blob.sha, sha); assert.equal(blob.encoding, 'base64');
            const bytes = Buffer.from(blob.content, 'base64');
            assert.equal(createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'), sha);
            encoded += bytes.toString('utf8');
          }
          const patch = brotliDecompressSync(Buffer.from(encoded, 'base64'), { maxOutputLength: 1024 * 1024 });
          assert.equal(createHash('sha256').update(patch).digest('hex'), '8ca435c13b20152177beddbd418ab5cc9d92acf0c80f17d9cddec95ff66177b3');
          writeFileSync('/tmp/yoke-m1.patch', patch);
          git('apply', '--check', '/tmp/yoke-m1.patch');
          git('apply', '/tmp/yoke-m1.patch');
          git('rm', '.github/workflows/dev-validation-bundle.yml');
          git('add', '-A');
          git('diff', '--cached', '--check');
          const expected = `4f080f21c54dfc0fe38db18760c80d3a9001ac5d README.md
          43777c62406fe3edcfc245aea225d2e2b31e5c25 docs/CONTROL-PLANE-PREVIEW.md
          cc17910b92da18f9646730256a91f3a1a03bd75f docs/NATIVE-WORKSPACES.md
          6ca94a992e2757874bec2919e51d1e7f9feb85c5 docs/YOKE-2.0-PLAN.md
          4ea5daa6cd092541a107a94627c19b28913ab3e6 docs/YOKE-2.0-WORKSPACES.md
          e5ae2ee3ffb56abd552d67bf110175335587860c src/control-plane/cli.ts
          1c0a7f4e859bf04c6a12081160c300eeebbdd4d5 src/control-plane/native-action.ts
          2fd2cde57aa94f68dcd3e2c7b69ad0b8d5e3e765 src/control-plane/store.ts
          258f2d9d3e9a5a6d28366b9a8066b51c5abae357 src/control-plane/workspace-broker.ts
          965fed9f2b049c859bbfaf66e17ee065908339e7 src/control-plane/workspace-snapshot.ts
          8bc134fbf6444ec6910f440321c6ac90c03dab4d src/execution/actions.ts
          3ddc5af3486f91cf9e2c13a6141e0bc0d14e5f60 src/loop/git.ts
          53dcc507424d35911e650ec66f9bf906595f1830 src/loop/loop.ts
          7e6187aa2b2dd5481a1b5b3b2050cd75c5673d37 src/loop/run-command.ts
          2068693822af5d724945703bbec4e9df6e199888 src/loop/runner.ts
          418098186cbb303c0c3e4282d5ad21784e5af696 src/retrofit/gitignore.ts
          a99c3f6d35e80010236328a2d2e145c5ccbb2ee3 tests/control-plane/native-workspace.integration.test.ts
          7b82632f398270b8d4dc47ff4d1d1542bf57672b tests/control-plane/owned-store.test.ts
          069633298569fdd8210f40a66c70bc78e96af7f1 tests/control-plane/workspace-broker.test.ts
          02d385c2a3dc28aeb8e7d2c69ccc05cf27f527f7 tests/loop/git.test.ts
          DELETE .github/workflows/dev-validation-bundle.yml`.split('\n').map(line => {
            const [sha, path] = line.trim().split(' ');
            return { path, mode: '100644', type: 'blob', sha: sha === 'DELETE' ? null : sha };
          });
          const changed = git('diff', '--cached', '--name-only').split('\n').sort();
          assert.deepEqual(changed, expected.map(entry => entry.path).sort());
          for (const entry of expected.filter(entry => entry.sha)) assert.equal(git('rev-parse', `:${entry.path}`), entry.sha, entry.path);
          writeFileSync('/tmp/yoke-m1-expected.json', JSON.stringify(expected));
          console.log('Reviewed patch and all 21 changed-path identities match. No refs changed.');
          JS
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --reporter=json --outputFile=/tmp/yoke-m1-tests.json
      - run: npm run yoke -- validate canon
      - run: npm run docs:check
      - run: npm run audit:ci
      - run: npm run package:check
      - name: Publish validated Git objects only, never a branch or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const entries = JSON.parse(readFileSync('/tmp/yoke-m1-expected.json', 'utf8'));
          assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
          assert.equal(git('diff', '--name-only'), '', 'Checks changed tracked working files');
          assert.deepEqual(git('diff', '--cached', '--name-only').split('\n').sort(), entries.map(entry => entry.path).sort());
          const tests = JSON.parse(readFileSync('/tmp/yoke-m1-tests.json', 'utf8'));
          assert.equal(tests.success, true); assert.equal(tests.numFailedTests, 0); assert.equal(tests.numPassedTests, 1549);
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/HECer/yoke/git/${path}`, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(30000) });
            assert.ok(response.ok, `Git object publication failed: HTTP ${response.status}`);
            return response.json();
          };
          for (const entry of entries.filter(entry => entry.sha)) {
            assert.equal(git('rev-parse', `:${entry.path}`), entry.sha, entry.path);
            const blob = await api('blobs', { encoding: 'base64', content: readFileSync(entry.path).toString('base64') });
            assert.equal(blob.sha, entry.sha, entry.path);
          }
          const tree = await api('trees', { base_tree: git('rev-parse', 'HEAD^{tree}'), tree: entries });
          assert.equal(tree.sha, git('write-tree'), 'Server and reviewed local Git trees differ');
          const report = { parent: process.env.GITHUB_SHA, tree: tree.sha, patchSha256: '8ca435c13b20152177beddbd418ab5cc9d92acf0c80f17d9cddec95ff66177b3', tests: { passed: tests.numPassedTests, failed: tests.numFailedTests, files: tests.testResults.length }, checks: ['install', 'lint', 'build', 'tests', 'canon', 'docs:check', 'audit:ci', 'package:check'], entries, refsChanged: false, temporaryWorkflowRemoved: true };
          writeFileSync('/tmp/yoke-m1-validation.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: yoke-m1-validated-tree
          path: /tmp/yoke-m1-validation.json
          retention-days: 1
          if-no-files-found: error
