canonVersion: 1.13.0
agents:
  - codex
loop:
  enabled: true
  parallel: 1
  isolate: false
  timeoutMinutes: 30
  maxCallMinutes: 60
  progressTimeoutMinutes: 20
  onAmbiguity: resolve
runner:
  agent: codex
  permissions: safe
verify:
  command: npm test
  retries: 1
  requireCriteria: true
design:
  mode: off
  max: 4
