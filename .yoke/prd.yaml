- id: dashboard-foundation
  title: Establish dashboard telemetry and control contracts
  priority: 1
  acceptance:
    - id: server
      text: The dashboard has typed, bounded helpers for workspace analytics, project
        history/events, and typed control payloads while preserving existing
        routes.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=server
    - id: analytics
      text: Dashboard projections preserve unknown usage and measurement coverage
        instead of converting unavailable values to zero.
      verify:
        - npm test -- tests/dashboard/analytics.test.ts
          --testNamePattern=analytics
    - id: security
      text: New dashboard reads and writes remain loopback-only, same-origin,
        session-authorized, path-safe, and protected against untrusted HTML.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=security
  passes: true
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-history-api
  title: Add historical workspace and run projections
  priority: 2
  acceptance:
    - id: history
      text: Workspace and project APIs expose bounded date-range and bucketed
        aggregates for tokens, calls, outcomes, time, and cost coverage.
      verify:
        - npm test -- tests/dashboard/analytics.test.ts --testNamePattern=history
    - id: runs
      text: Project history groups recorded events and measurements by run and exposes
        agent, provider, model, variant, role, phase, and timestamps when
        available.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=runs
    - id: ranking
      text: Workspace projections rank projects and execution dimensions by attention,
        activity, tokens, cost, acceptance, and name with deterministic tie
        breaking.
      verify:
        - npm test -- tests/dashboard/analytics.test.ts --testNamePattern=ranking
  passes: true
  needs:
    - dashboard-foundation
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-controls
  title: Add safe dashboard controls and operator input
  priority: 3
  acceptance:
    - id: controls
      text: An authorized pause request uses the existing loop and goal pause
        sentinels and returns a clear requested state without executing
        arbitrary input.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=controls
    - id: resume
      text: An authorized resume request delegates to the existing loop or goal
        runner, respects the project lock, and refuses duplicate starts.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=resume
    - id: notes
      text: Authorized operator notes are bounded, append-only, escaped on read, and
        visible as project-local timeline data.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=notes
    - id: changes
      text: Authorized change requests reuse the existing append-only change inbox and
        return a durable request identifier and pending state.
      verify:
        - npm test -- tests/dashboard/server.test.ts --testNamePattern=changes
  passes: true
  needs:
    - dashboard-foundation
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-shell
  title: Rebuild the dashboard shell and workspace ranking view
  priority: 4
  acceptance:
    - id: shell
      text: The dashboard renders a modern control-room shell with persistent
        navigation, command bar, attention region, metric strip, and ranked
        project rows.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=shell
    - id: themes
      text: Dark and light themes use shared CSS tokens, respect system preference on
        first load, persist explicit choice, and retain readable contrast.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=themes
    - id: sort
      text: Search, status, date scope, and project sort controls compose correctly
        and survive URL navigation without leaking secrets.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=sort
  passes: true
  needs:
    - dashboard-history-api
    - dashboard-controls
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-live-view
  title: Build project live operations view
  priority: 5
  acceptance:
    - id: live
      text: A project view shows current goal/loop state, freshness, safe controls,
        objective progress, current worker metadata, and the last successful
        sync.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=live
    - id: timeline
      text: The project view renders a bounded chronological event timeline with
        expandable run, story, phase, agent, and token details plus local/UTC
        labeling.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=timeline
    - id: compose
      text: A user can add a note or queue a change from the live view and receives
        pending, applied, validation, and failure feedback.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=compose
  passes: true
  needs:
    - dashboard-history-api
    - dashboard-controls
    - dashboard-shell
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-analytics-view
  title: Build analytics and history explorer
  priority: 6
  acceptance:
    - id: charts
      text: Workspace and project analytics render time-bucketed tokens, calls, cost
        state, duration, and outcomes for selectable date windows without false
        precision.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=charts
    - id: dimensions
      text: Analytics tables rank agents, providers, models, roles, phases, projects,
        and runs and preserve Not reported and Unknown labels.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=dimensions
    - id: coverage
      text: Corrupt, partial, unavailable, and stale telemetry is explained in the
        relevant panel and does not break other projects or historical windows.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=coverage
  passes: false
  needs:
    - dashboard-history-api
    - dashboard-shell
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-resilience
  title: Make the control room accessible and resilient
  priority: 7
  acceptance:
    - id: accessibility
      text: Keyboard navigation, visible focus, semantic labels, reduced motion,
        contrast, and non-color state cues work across the dashboard shell and
        controls.
      verify:
        - npm test -- tests/dashboard/page.test.ts
          --testNamePattern=accessibility
    - id: states
      text: Loading, empty, error, offline, stale, missing-project, and partially
        measured states are explicit and actionable at workspace and project
        scope.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=states
    - id: bounds
      text: Refresh and navigation cancel obsolete requests, retain bounded
        concurrency and reads, and do not accumulate timers or duplicate event
        handlers.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=bounds
  passes: false
  needs:
    - dashboard-live-view
    - dashboard-analytics-view
  area: dashboard
  writes:
    - src/dashboard
    - tests/dashboard
- id: dashboard-documentation
  title: Synchronize dashboard documentation and integrated checks
  priority: 8
  acceptance:
    - id: docs
      text: README and dashboard documentation describe the current screens, data
        coverage semantics, controls, security boundary, and local startup
        command.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=docs
    - id: regression
      text: Existing dashboard behavior and the complete TypeScript test suite remain
        green after the overhaul.
      verify:
        - npm test -- tests/dashboard
    - id: build
      text: The dashboard compiles and lint checks pass with no generated runtime
        state or credentials included in the source change.
      verify:
        - npm test -- tests/dashboard/page.test.ts --testNamePattern=build
  passes: false
  needs:
    - dashboard-resilience
  area: dashboard
  writes:
    - README.md
    - docs
    - tests/dashboard
